<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Risques - CHU Saint-Pierre</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .form-section {
            background-color: #FFFDE7;
            border: 1px solid #E0E0E0;
        }
        .form-header {
            color: #1A365D;
            border-bottom: 2px solid #CBD5E0;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- En-tête Principal -->
    <header class="bg-white shadow-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-4">
                <!-- Logo CHU Saint-Pierre (SVG fidèle) -->
                <svg class="h-12 w-auto" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="400" height="120" fill="white"/>
                    <path d="M20 20 H50 V50 H90 V20 H120 V100 H90 V70 H50 V100 H20 Z" fill="#D32F2F"/>
                    <path d="M70 65 L95 45 L120 65 L95 85 Z" fill="#E65100"/>
                    <text x="135" y="55" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#D32F2F">CHU Saint-Pierre</text>
                    <text x="135" y="85" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#D32F2F">UMC Sint-Pieter</text>
                </svg>
                <span class="text-xl font-semibold text-slate-700 hidden sm:inline border-l pl-4 border-slate-300">
                    Gestion des Risques & Quality Risk Management
                </span>
            </div>
            
            <!-- Navigation par Onglets -->
            <nav class="flex space-x-2 mt-2 sm:mt-0">
                <button onclick="switchTab('encodage')" id="btn-encodage" class="px-4 py-2 rounded-lg font-medium transition-colors bg-blue-700 text-white shadow">
                    Encodage
                </button>
                <button onclick="switchTab('bd')" id="btn-bd" class="px-4 py-2 rounded-lg font-medium transition-colors bg-white text-slate-700 hover:bg-slate-100">
                    Base de Données
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-4 py-2 rounded-lg font-medium transition-colors bg-white text-slate-700 hover:bg-slate-100">
                    Tableau de Bord
                </button>
            </nav>
        </div>
    </header>

    <!-- Conteneur Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- ================= ONGLET 1 : FORMULAIRE D'ENCODAGE ================= -->
        <section id="tab-encodage" class="space-y-6">
            <form id="riskForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                
                <!-- SECTION 1: Classification -->
                <div class="form-section p-6 rounded-xl shadow-sm">
                    <h2 class="form-header text-xl font-bold pb-2 mb-4">1 Classification du dysfonctionnement</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="processus" class="block text-sm font-semibold text-slate-700 mb-1">Quel processus ? *</label>
                            <select id="processus" onchange="populateSubProcesses()" required class="w-full bg-white border border-slate-300 rounded-md p-2.5 shadow-sm focus:ring-2 focus:ring-blue-500">
                                <option value="">-- Sélectionner un processus --</option>
                                <option value="Réception">Réception</option>
                                <option value="Lavage / Désinfection">Lavage / Désinfection</option>
                                <option value="Contrôle">Contrôle</option>
                                <option value="Conditionnement">Conditionnement</option>
                                <option value="Stérilisation">Stérilisation</option>
                                <option value="Transport/lavage des armoires">Transport/lavage des armoires</option>
                            </select>
                        </div>
                        
                        <div>
                            <label for="sousProcessus" class="block text-sm font-semibold text-slate-700 mb-1">Quel sous-processus ? *</label>
                            <select id="sousProcessus" onchange="populateDysfunctions()" disabled required class="w-full bg-white border border-slate-300 rounded-md p-2.5 shadow-sm focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:cursor-not-allowed">
                                <option value="">-- Sélectionner d'abord un processus --</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="dysfonctionnement" class="block text-sm font-semibold text-slate-700 mb-1">Quel dysfonctionnement spécifique ? *</label>
                        <select id="dysfonctionnement" disabled required class="w-full bg-white border border-slate-300 rounded-md p-2.5 shadow-sm focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:cursor-not-allowed">
                            <option value="">-- Sélectionner d'abord un sous-processus --</option>
                        </select>
                    </div>
                </div>

                <!-- SECTION 2: Actions & Causes -->
                <div class="form-section p-6 rounded-xl shadow-sm">
                    <h2 class="form-header text-xl font-bold pb-2 mb-4">2 Actions</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label for="acteur" class="block text-sm font-semibold text-slate-700 mb-1">Acteur professionnel impliqué</label>
                            <select id="acteur" class="w-full bg-white border border-slate-300 rounded-md p-2 shadow-sm">
                                <option value="">-- Sélectionner --</option>
                                <option value="Agent de stérilisation">Agent de stérilisation</option>
                                <option value="Infirmier / Soignant">Infirmier / Soignant</option>
                                <option value="Technicien biomédical">Technicien biomédical</option>
                                <option value="Prestataire externe">Prestataire externe</option>
                            </select>
                        </div>

                        <div>
                            <label for="cause" class="block text-sm font-semibold text-slate-700 mb-1">Cause du dysfonctionnement</label>
                            <select id="cause" class="w-full bg-white border border-slate-300 rounded-md p-2 shadow-sm">
                                <option value="">-- Sélectionner --</option>
                                <option value="Cause humaine">Cause humaine</option>
                                <option value="Panne d'équipement">Panne d'équipement</option>
