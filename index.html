<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Risques - ASTER</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (pour l'export Excel .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full font-sans text-slate-800 flex flex-col">

    <!-- En-tête / Navigation -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i data-lucide="shield-alert" class="w-7 h-7 text-indigo-400"></i>
                <span class="font-bold text-xl tracking-tight">Gestion des Risques</span>
            </div>
            
            <nav class="flex items-center space-x-4">
                <button id="nav-encode" onclick="showTab('encode')" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Encoder un risque
                </button>
                <button id="nav-dashboard" onclick="showTab('dashboard')" class="hidden px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 flex items-center gap-2 text-amber-300">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Tableau de bord (Admin)
                </button>
                <div class="border-l border-slate-700 h-6 mx-2"></div>
                <div id="auth-controls" class="flex items-center gap-3">
                    <span id="user-badge" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700 text-slate-300">Rôle: Utilisateur</span>
                    <button onclick="toggleAdmin()" id="btn-toggle-admin" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-md font-medium transition">
                        Connexion Admin
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- SECTION 1 : FORMULAIRE D'ENCODAGE -->
        <section id="section-encode" class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900 mb-2 flex items-center gap-2">
                <i data-lucide="file-plus" class="text-indigo-600"></i> Encoder un nouveau risque
            </h2>
            <p class="text-sm text-slate-500 mb-6">Renseignez les détails du risque identifié. Le registre est automatiquement mis à jour à chaque validation.</p>

            <form id="risk-form" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Processus / Service concerné *</label>
                    <input type="text" id="processus" required placeholder="Ex: Stérilisation Centralisée, Bloc Opératoire" 
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="
