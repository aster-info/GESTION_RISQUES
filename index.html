<script>
    // Mot de passe d'administration (modifiable)
    const ADMIN_PASSWORD = "aster2026";

    let isAdmin = false;
    let risks = JSON.parse(localStorage.getItem('aster_risks')) || [];
    let chartCriticite = null;

    // Initialisation des icônes Lucide en toute sécurité
    document.addEventListener("DOMContentLoaded", function() {
        if (window.lucide) {
            lucide.createIcons();
        }
        updateCalculatedScore();
    });

    // Connexion / Déconnexion Administrateur
    function toggleAdmin() {
        if (!isAdmin) {
            const inputPwd = prompt("Veuillez saisir le mot de passe Administrateur :");
            
            // Si l'utilisateur clique sur Annuler
            if (inputPwd === null) return;

            // Vérification du mot de passe (sans espaces indésirables)
            if (inputPwd.trim() === ADMIN_PASSWORD) {
                isAdmin = true;
                updateAdminUI();
                showTab('dashboard'); // Redirection forcée vers le tableau de bord
            } else {
                alert("Mot de passe incorrect.");
            }
        } else {
            isAdmin = false;
            updateAdminUI();
            showTab('encode'); // Retour à l'encodage lors de la déconnexion
        }
    }

    // Mise à jour de l'affichage des boutons selon le rôle
    function updateAdminUI() {
        const badge = document.getElementById('user-badge');
        const btn = document.getElementById('btn-toggle-admin');
        const navDashboard = document.getElementById('nav-dashboard');

        if (isAdmin) {
            badge.textContent = "Rôle: Administrateur";
            badge.className = "text-xs bg-amber-900/40 text-amber-300 px-2.5 py-1 rounded-full border border-amber-700/50 font-medium";
            btn.textContent = "Déconnexion Admin";
            btn.className = "text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-md font-medium transition";
            navDashboard.classList.remove('hidden');
        } else {
            badge.textContent = "Rôle: Utilisateur";
            badge.className = "text-xs bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700 text-slate-300";
            btn.textContent = "Connexion Admin";
            btn.className = "text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-md font-medium transition";
            navDashboard.classList.add('hidden');
        }
    }

    // Navigation explicite entre sections
    function showTab(tabName) {
        const secEncode = document.getElementById('section-encode');
        const secDashboard = document.getElementById('section-dashboard');

        if (tabName === 'dashboard') {
            if (!isAdmin) {
                alert("Accès refusé. Veuillez vous connecter en tant qu'administrateur.");
                return;
            }
            secEncode.classList.add('hidden');
            secDashboard.classList.remove('hidden');
            renderDashboard(); // Charger les données et graphiques
        } else {
            secDashboard.classList.add('hidden');
            secEncode.classList.remove('hidden');
        }

        if (window.lucide) {
            lucide.createIcons();
        }
    }
